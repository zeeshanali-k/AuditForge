name: Release (Windows)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  check-version:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check
        run: |
          CURR=$(grep 'auditforge\.version=' gradle.properties | cut -d= -f2)
          PREV=$(git show HEAD~1:gradle.properties 2>/dev/null | grep 'auditforge\.version=' | cut -d= -f2 || echo "")
          if [ "$CURR" != "$PREV" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  build-and-release:
    needs: [ check-version ]
    if: |
      always() && (
        startsWith(github.ref, 'refs/tags/') ||
        needs.check-version.outputs.version_changed == 'true'
      )
    runs-on: windows-latest
    environment: devscion
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Read version
        id: ver
        shell: bash
        run: echo "value=$(./gradlew -q :composeApp:printVersion)" >> $GITHUB_OUTPUT

      - name: Compute release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "value=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "value=v${{ steps.ver.outputs.value }}-nightly" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Create release if absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          VERSION="${{ steps.ver.outputs.value }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists."
          elif [[ "${{ steps.tag.outputs.is_tag }}" == "true" ]]; then
            gh release create "$TAG" \
              --title "AuditForge $VERSION" \
              --notes "## AuditForge $VERSION

          See [CHANGELOG](https://github.com/${{ github.repository }}/commits/$TAG) for changes."
          else
            gh release create "$TAG" \
              --prerelease \
              --title "AuditForge $VERSION (nightly)" \
              --notes "Automated build from \`main\` · ${{ github.sha }}"
          fi

      - name: Build Windows installer
        run: ./gradlew :composeApp:packageMsi -Pflavor=prod

      - name: Upload MSI to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.value }}" \
            composeApp/build/compose/binaries/main/msi/*.msi --clobber
